<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <title>IREN_NET - Portal WiFi</title>
    <meta name="viewport" content="initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta http-equiv="Cache" content="no-cache" />

    <link rel="icon" href="./img/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="./css/index.css" />
  </head>

  <body cz-shortcut-listen="true">
    <div class="body-loading" id="body_loading">
      <img src="./img/loading.gif" style="width: 320px; height: 240px" />
    </div>

    <div class="body-wrapper">
      <div class="body-background">
        <div class="body-background-mask"></div>
      </div>

      <div class="body-content-wrapper">
        <div class="body-content" id="body_content">
          <div class="content-decoration-wrapper">
            <!--logo-->
            <div class="content-logo-wrapper">
              <img class="content-logo" src="./img/logo.png" />
            </div>
          </div>

          <div class="login-wrapper">
            <div class="login-form-wrapper">
              <div>
                <div class="login-form-title">
                </div>
              </div>

              <div class="login-item login-item-fixaccount hide">
                <input
                  class="rj-input"
                  type="text"
                  id="account_input"
                  data-i18n-placeholder="account"
                />
              </div>
              <div class="login-item login-item-fixaccount hide">
                <input
                  class="rj-input"
                  type="password"
                  id="account_password"
                  data-i18n-placeholder="password"
                />
              </div>
              <div class="login-item login-item-voucher hide">
                <input
                  class="rj-input"
                  type="text"
                  id="voucher_code"
                  data-i18n-placeholder="accesscode"
                />
              </div>
            </div>

            <div class="login-msg" id="login_msg"></div>
            <button
              class="rj-btn rj-btn-primary login-btn"
              id="login_btn"
              data-i18n="login"
            >
            </button>

            <div class="other-btn-wrapper">
              <div class="login-split-line hide" id="login_split_line">
                <span class="left"></span>
                <span data-i18n="or">
                </span>
                <span class="right"></span>
              </div>
              <button
                class="rj-btn login-item login-item-pass hide"
                onclick="IndexObj.changeLoginOption('pass')"
                data-i18n="one_click_login"
              >
              </button>
              <button
                class="rj-btn login-item login-item-fixaccount hide"
                onclick="IndexObj.changeLoginOption('fixaccount')"
                data-i18n="account_login"
              >
              </button>
              <button
                class="rj-btn login-item login-item-voucher hide"
                onclick="IndexObj.changeLoginOption('voucher')"
                data-i18n="voucher_login"
              >
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="text/javascript" src="./js/jquery/jquery.min.js"></script>
    <script type="text/javascript" src="./js/language.js"></script>
    <script type="text/javascript" src="./js/i18n/i18n.js"></script>
    <script type="text/javascript" src="./js/index.js"></script>
    <script type="text/javascript" src="./loadConfig.json"></script>

    <script type="text/javascript">
    </script>

<style>
.iren-shop{max-width:560px;margin:18px auto;padding:18px;background:#f5faff;border:2px solid #8bc8ff;border-radius:18px;color:#083b83;font-family:Arial,sans-serif;box-sizing:border-box}
.iren-shop h2{text-align:center;margin:4px 0 14px;color:#0754b8;font-size:22px}
.iren-prices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.iren-price{background:#e2f1ff;border:1px solid #7ebcff;border-radius:12px;padding:11px;text-align:center;font-size:14px;font-weight:700}
.iren-price b{display:block;font-size:17px;margin-top:5px;color:#063b91}
.iren-qris{display:block;width:min(100%,330px);height:auto;margin:14px auto 6px;border-radius:10px}
.iren-note{text-align:center;font-size:12px;line-height:1.5;color:#23486f}
@media(max-width:360px){.iren-prices{grid-template-columns:1fr}}
</style>
<div class="iren-shop">
 <h2>PAKET INTERNET IREN_NET</h2>
 <div class="iren-prices">
  <div class="iren-price">3 JAM<b>Rp2.000</b></div>
  <div class="iren-price">12 JAM<b>Rp4.000</b></div>
  <div class="iren-price">1 HARI<b>Rp6.000</b></div>
  <div class="iren-price">3 HARI<b>Rp18.000</b></div>
  <div class="iren-price">1 MINGGU<b>Rp30.000</b></div>
  <div class="iren-price">1 BULAN<b>Rp120.000</b></div>
  <div class="iren-price" style="grid-column:1/-1">2 AKUN<b>Rp150.000</b></div>
 </div>
<div style="text-align:center; margin:20px;">
<h3>PEMBAYARAN QRIS GOPAY</h3>
<img src="1795500340347.png" alt="QRIS GoPay" style="width:250px; max-width:100%;">
<p>Silakan scan QRIS untuk pembayaran.</p>
</div>
  </body>
</html>
